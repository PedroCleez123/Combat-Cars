      .scoreboard-row[data-team="blue"] { border-left: 3px solid #54b8ff; }

    <script>
      // `combat-cars.pages.dev.` is a distinct web origin from the canonical
      // Pages host. Redirect before the module starts so the signalling Worker
      // sees its exact allowlisted origin and can create the personal room.
      (() => {
        const canonicalHost = "combat-cars.pages.dev";
        if (window.location.hostname === `${canonicalHost}.`) {
          const canonicalUrl = new URL(window.location.href);
          canonicalUrl.hostname = canonicalHost;
          window.location.replace(canonicalUrl.href);
        }
      })();
    </script>

  <body>
    <main id="multiplayer-arena">
      <canvas id="scene" width="960" height="540" aria-label="Arena Combat Cars"></canvas>
      <div id="gameplay-input-surface" data-gameplay-surface="true" aria-hidden="true"></div>
      <output id="fps-counter" class="fps-counter" aria-label="Fotogramas por segundo" aria-live="off">FPS —</output>
      <aside id="boost-meter" class="boost-meter" data-p2p-boost-meter role="meter" aria-label="Nitro" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="boost-meter__dial" aria-hidden="true"></span>
        <span class="boost-meter__fill" data-p2p-boost-fill aria-hidden="true"></span>
        <span class="boost-meter__label" aria-hidden="true">NITRO</span>
        <strong class="boost-meter__value" data-p2p-boost-value>0</strong>
      </aside>
      <section id="renderer-loading-overlay" class="renderer-error" role="alert" aria-live="assertive" hidden>
        <strong>La arena visual no está disponible</strong>
        <p id="renderer-loading-status">Preparando WebGL…</p>
      </section>

      <header class="arena-header">
        <button id="fullscreen-toggle" class="fullscreen-toggle" type="button" aria-label="Activar pantalla completa" aria-pressed="false">Pantalla completa</button>
        <details id="multiplayer-menu" class="menu">
          <summary id="multiplayer-menu-toggle" aria-label="Abrir menú de partida">Menú</summary>
          <section class="menu-panel" aria-labelledby="menu-title">
            <h1 id="menu-title">Partida privada</h1>
            <div class="menu-form">
              <label>Nombre de piloto
                <input id="name" maxlength="16" placeholder="Tu nombre" autocomplete="nickname" required>
              </label>
              <div class="join-panel">
                <strong>Unirse a otra sala</strong>
                <div class="join-row"><input id="join-code" inputmode="text" autocomplete="off" maxlength="14" placeholder="Clave de sala" aria-label="Clave de sala"><button id="join" class="secondary" type="button" disabled>Unirse</button></div>
                <button id="return-personal-menu" class="secondary" type="button" hidden>Volver a mi sala personal</button>
              </div>
            </div>
          </section>
        </details>
      </header>

      <section id="multiplayer-lobby-panel" class="lobby-panel" aria-label="Lobby de la sala">
        <details id="lobby-panel-disclosure" class="lobby-disclosure" open>
          <summary aria-label="Mostrar u ocultar el panel del lobby">Lobby</summary>
          <div id="room" class="hidden">
            <h2 id="lobby-title">Lobby de partida</h2>
            <p id="room-info" class="room-info"></p>
            <div class="room-code-row"><input id="room-code" class="room-code" readonly aria-label="Clave corta de sala"><button id="copy-room-code" class="secondary" type="button">Copiar</button></div>
            <div class="lobby-meta"><span id="lobby-player-count">Esperando jugadores</span><span id="lobby-match-state">Lobby</span></div>
            <label id="host-mode-control" class="host-mode-control" hidden>Modo de juego
              <select id="mode">
                <option value="" selected>Sin modo seleccionado</option>
                <option value="1v1">1v1</option>
                <option value="2v2">2v2</option>
                <option value="3v3">3v3</option>
                <option value="ffa">Todos contra todos</option>
              </select>
            </label>
            <button id="configure-room" class="start-match" type="button" hidden>Confirmar modo y abrir equipos</button>
            <div id="team-picker" class="team-picker" aria-label="Elegir equipo">
              <span class="team-picker-label">Equipo</span>
              <button id="team-choice-blue" class="team-choice" type="button" data-team="blue" aria-pressed="false">Azul</button>
              <button id="team-choice-red" class="team-choice" type="button" data-team="red" aria-pressed="false">Rojo</button>
            </div>
            <div id="lobby-players" class="lobby-players" aria-label="Jugadores en sala"></div>
            <button id="retry-personal-room" class="secondary start-match" type="button" hidden>Reintentar mi sala personal</button>
            <button id="start-match" class="start-match" type="button" hidden>Empezar partida</button>
            <button id="return-personal-room" class="secondary start-match" type="button" hidden>Volver a mi sala personal</button>
            <strong id="match-countdown" class="match-clock" hidden>05:00</strong>
          </div>
        </details>
      </section>

      <section id="scoreboard" class="scoreboard" hidden aria-label="Marcador">
        <div class="scoreboard-header"><span>Marcador</span><span id="scoreboard-mode">1V1</span><span id="scoreboard-time" class="scoreboard-time" hidden>05:00</span></div>
        <div id="scoreboard-groups" class="scoreboard-groups"></div>
        <div id="scoreboard-rows"></div>
      </section>
      <p id="status" class="status" role="status" aria-live="polite">Entrenamiento local</p>
    </main>
    <script type="module" src="/src/p2p-multiplayer-entry.js"></script>
  </body>
</html>
