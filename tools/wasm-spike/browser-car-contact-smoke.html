<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RocketSim WASM · impulso coche-coche · P2P-WASM-06</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, Consolas, monospace; background: #0d1520; color: #d8e6f1; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(48rem, calc(100vw - 3rem)); padding: 1.5rem; border: 1px solid #42617a; border-radius: .75rem; background: #132331; }
      h1 { margin-top: 0; font-size: 1.15rem; }
      p { color: #a9bece; line-height: 1.5; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 2rem; color: #a7eecc; }
      .error { color: #ff9d9d; }
    </style>
  </head>
  <body>
    <main>
      <h1>RocketSim WASM · transferencia de impulso · P2P-WASM-06</h1>
      <p>Dos coches azules sobre seis planos. El evento es un proxy por estados de la transferencia de impulso, no telemetría nativa carContact.</p>
      <pre id="status" aria-live="polite">Inicializando módulo…</pre>
    </main>
    <script type="module">
      import { captureWasmCarContactTrace } from "./car-contact-trace.mjs";
      import { compareCarContactTraces } from "./car-contact-trace-contract.mjs";

      const output = document.querySelector("#status");
      const startedAt = performance.now();
      try {
        const trace = await captureWasmCarContactTrace();
        const report = compareCarContactTraces(trace, trace);
        const result = {
          ok: report.ok,
          story: "P2P-WASM-06",
          ticks: trace.samples.length,
          fixture: trace.fixture,
          inputContractValid: true,
          impulseTransferProxy: "target +X velocity jump and chaser +X velocity drop",
          firstTransferTick: report.firstTransferTick,
          tolerances: report.tolerances,
          elapsedMs: performance.now() - startedAt,
        };
        window.__arsenalWasmBrowserCarContactSmoke = result;
        output.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        const result = { ok: false, story: "P2P-WASM-06", error: String(error?.message || error) };
        window.__arsenalWasmBrowserCarContactSmoke = result;
        output.classList.add("error");
        output.textContent = JSON.stringify(result, null, 2);
        console.error("RocketSim WASM car-contact browser smoke failed", error);
      }
    </script>
  </body>
</html>
