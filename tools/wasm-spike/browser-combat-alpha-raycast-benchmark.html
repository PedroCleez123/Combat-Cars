<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RocketSim WASM · benchmark raycast combat-alpha · P2P-WASM-16</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, Consolas, monospace; background: #0d1520; color: #d8e6f1; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(48rem, calc(100vw - 3rem)); padding: 1.5rem; border: 1px solid #42617a; border-radius: .75rem; background: #132331; }
      h1 { margin-top: 0; font-size: 1.15rem; }
      p { color: #a9bece; line-height: 1.5; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 2rem; color: #a7eecc; }
      .error { color: #ff9d9d; }
    </style>
  </head>
  <body>
    <main>
      <h1>RocketSim WASM · benchmark raycast combat-alpha · P2P-WASM-16</h1>
      <p>Ejecuta 12 raycasts estáticos por tick sobre el perfil combat-alpha y comprueba que las consultas no avanzan el tick de simulación.</p>
      <pre id="status" aria-live="polite">Inicializando benchmark…</pre>
    </main>
    <script type="module">
      import createRocketSimWasm from "./build/rocketsim_wasm.mjs";
      import { runP2PWasmCombatAlphaRaycastBenchmark } from "./combat-alpha-static-raycast-contract.mjs";

      const output = document.querySelector("#status");
      const startedAt = performance.now();

      try {
        const module = await createRocketSimWasm();
        const report = runP2PWasmCombatAlphaRaycastBenchmark({ module });
        const result = { ok: true, ...report, elapsedMs: performance.now() - startedAt };
        window.__arsenalWasmBrowserCombatAlphaRaycastBenchmark = result;
        output.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        const result = { ok: false, story: "P2P-WASM-16", error: String(error?.message || error) };
        window.__arsenalWasmBrowserCombatAlphaRaycastBenchmark = result;
        output.classList.add("error");
        output.textContent = JSON.stringify(result, null, 2);
        console.error("RocketSim WASM combat-alpha raycast benchmark failed", error);
      }
    </script>
  </body>
</html>
